<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <base href="/" />
    <meta name="texlite-base-path" content="/" />
    <script>
      // Apply the browser preference before styles paint; keep this key in
      // sync with scopedStorageKey("texlite-theme") in theme.ts.
      try {
        const base = document.querySelector('meta[name="texlite-base-path"]').content;
        const key = base === "/" ? "texlite-theme" : `texlite-theme:base=${encodeURIComponent(base)}`;
        const preference = localStorage.getItem(key);
        const dark = preference === "dark" || (preference === "system" && typeof matchMedia === "function" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch { document.documentElement.dataset.theme = "light"; }
      document.documentElement.style.colorScheme = document.documentElement.dataset.theme;
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Source+Code+Pro:wght@400;500;600&amp;display=swap" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/iosevka@5.2.5/400.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/iosevka@5.2.5/600.css" />
    <link rel="icon" type="image/svg+xml" href="texlite-icon.svg" />
    <title>TexLite</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="main.tsx"></script>
  </body>
</html>
